# The React/Vite frontend lives in a subfolder of the repository.
[build]
  base = "DentalCare-main/dental"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing: serve index.html for page paths like /doctors or /services/...
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
